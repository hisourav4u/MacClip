name: MacClip

options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"
  bundleIdPrefix: com.clipboardmanager
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ONLY_ACTIVE_ARCH: NO

targets:
  MacClip:
    type: application
    platform: macOS

    sources:
      - path: MacClip
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
        createIntermediateGroups: true

    resources:
      - path: MacClip/Resources/Assets.xcassets

    dependencies:
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework

    settings:
      base:
        PRODUCT_NAME: MacClip
        PRODUCT_BUNDLE_IDENTIFIER: com.clipboardmanager.app
        INFOPLIST_FILE: MacClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacClip/MacClip.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(inherited)"

schemes:
  MacClip:
    build:
      targets:
        MacClip: all
    run:
      config: Debug
    archive:
      config: Release
